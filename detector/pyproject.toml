[project]
name = "gke-cost-sentinel-detector"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "google-cloud-bigquery>=3.0.0",
    "pydantic-settings>=2.0.0",
    "groq>=0.11.0",
    "kubernetes>=28.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
