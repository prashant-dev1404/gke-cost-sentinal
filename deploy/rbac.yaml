apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: detector
rules:
- apiGroups: [""]
  resources: ["events", "pods", "pods/log", "nodes", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: detector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: detector
subjects:
- kind: ServiceAccount
  name: detector
  namespace: sentinel
